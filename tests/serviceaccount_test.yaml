suite: test serviceaccount
templates:
  - serviceaccount.yaml
tests:
  - it: should render a ServiceAccount by default
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1

  - it: should not render when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should enable automountServiceAccountToken
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should support custom annotations
    set:
      serviceAccount.annotations:
        iam.gke.io/gcp-service-account: my-sa@project.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: "my-sa@project.iam.gserviceaccount.com"

  - it: should use fullname as default name
    release:
      name: test
    asserts:
      - equal:
          path: metadata.name
          value: test-landb-alias-controller

  - it: should allow overriding the name
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
