suite: test podmonitor
templates:
  - podmonitor.yaml
tests:
  - it: should not render PodMonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render PodMonitor when enabled
    set:
      podMonitor:
        enabled: true
    asserts:
      - containsDocument:
          kind: PodMonitor
          apiVersion: monitoring.coreos.com/v1

  - it: should have correct name and selector labels
    set:
      podMonitor:
        enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-landb-alias-controller
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: landb-alias-controller
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should scrape /metrics on the metrics port
    set:
      podMonitor:
        enabled: true
    asserts:
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: "8080"
      - equal:
          path: spec.podMetricsEndpoints[0].path
          value: /metrics

  - it: should support custom interval and scrapeTimeout
    set:
      podMonitor:
        enabled: true
        interval: 30s
        scrapeTimeout: 10s
    asserts:
      - equal:
          path: spec.podMetricsEndpoints[0].interval
          value: 30s
      - equal:
          path: spec.podMetricsEndpoints[0].scrapeTimeout
          value: 10s

  - it: should support extra labels
    set:
      podMonitor:
        enabled: true
        labels:
          prometheus: monitoring
    asserts:
      - equal:
          path: metadata.labels.prometheus
          value: monitoring
