suite: test clusterrolebinding
templates:
  - clusterrolebinding.yaml
tests:
  - it: should render a ClusterRoleBinding by default
    asserts:
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1

  - it: should not render when rbac.create is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should have correct name
    release:
      name: test
    asserts:
      - equal:
          path: metadata.name
          value: test-landb-alias-controller

  - it: should reference the correct ClusterRole
    release:
      name: test
    asserts:
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: test-landb-alias-controller

  - it: should bind to the correct ServiceAccount
    release:
      name: test
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: test-landb-alias-controller
            namespace: NAMESPACE
