suite: test secret-env
templates:
  - secret-env.yaml
tests:
  - it: should not render Secret when secretEnv is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Secret with correct data when secretEnv is set
    set:
      secretEnv:
        OS_PASSWORD: "changeme"
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.OS_PASSWORD
          value: "Y2hhbmdlbWU="

  - it: should have correct name
    set:
      secretEnv:
        OS_PASSWORD: "foo"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-landb-alias-controller-env

  - it: should support multiple secret env vars
    set:
      secretEnv:
        OS_USERNAME: "user"
        OS_PASSWORD: "pass"
    asserts:
      - exists:
          path: data.OS_USERNAME
      - exists:
          path: data.OS_PASSWORD
